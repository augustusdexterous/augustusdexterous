[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-overfitting"
version = "0.1.0"
description = "Overfitting diagnostics for strategy backtests: DSR, PBO (CSCV), multiple testing, walk-forward and purged k-fold CV."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["backtest_overfitting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
